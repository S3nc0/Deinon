[package]
name = "fpv-shifter"
version = "0.1.0"
description = "Desktop photo editor that shifts a photo's first-person viewpoint using 4 points."
authors = ["FPV Shifter"]
edition = "2021"

[lib]
name = "fpv_shifter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "rayon"] }
webp = { version = "0.3", default-features = false }
rayon = "1"
base64 = "0.22"
thiserror = "2"
tempfile = "3"
same-file = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Image decoding and warping are far too slow without optimisation, even in tests.
[profile.dev.package."*"]
opt-level = 2
